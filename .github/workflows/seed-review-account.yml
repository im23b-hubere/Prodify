name: Seed Apple review account

# Seeds the demo account Apple's reviewers sign in with.
#
# Destructive: the target account's password is reset and its sessions and friendships are
# wiped. Credentials come from repository secrets so they never appear in this file, in the
# workflow-dispatch form, or in the run logs (GitHub masks secret values in output).
#
# Required secrets:
#   INTERNAL_JOB_KEY       Render → prodify-api → Environment → INTERNAL_JOB_KEY
#   APPLE_REVIEW_EMAIL     Sign-in address given to App Review
#   APPLE_REVIEW_PASSWORD  Sign-in password given to App Review (min. 12 characters)

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Production API base URL
        required: false
        default: https://prodify-api-46b1.onrender.com
        type: string

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Verify required secrets are configured
        env:
          INTERNAL_JOB_KEY: ${{ secrets.INTERNAL_JOB_KEY }}
          APPLE_REVIEW_EMAIL: ${{ secrets.APPLE_REVIEW_EMAIL }}
          APPLE_REVIEW_PASSWORD: ${{ secrets.APPLE_REVIEW_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${INTERNAL_JOB_KEY}" ] || missing="${missing} INTERNAL_JOB_KEY"
          [ -n "${APPLE_REVIEW_EMAIL}" ] || missing="${missing} APPLE_REVIEW_EMAIL"
          [ -n "${APPLE_REVIEW_PASSWORD}" ] || missing="${missing} APPLE_REVIEW_PASSWORD"
          if [ -n "${missing}" ]; then
            echo "Missing repository secrets:${missing}" >&2
            echo "Add them under Settings → Secrets and variables → Actions." >&2
            exit 1
          fi

      - name: Seed review account on production
        env:
          API_URL: ${{ inputs.api_url }}
          INTERNAL_JOB_KEY: ${{ secrets.INTERNAL_JOB_KEY }}
          APPLE_REVIEW_EMAIL: ${{ secrets.APPLE_REVIEW_EMAIL }}
          APPLE_REVIEW_PASSWORD: ${{ secrets.APPLE_REVIEW_PASSWORD }}
        run: |
          set -euo pipefail
          # Built with jq so the secrets are never interpolated into a shell string.
          body=$(jq -n \
            --arg email "${APPLE_REVIEW_EMAIL}" \
            --arg password "${APPLE_REVIEW_PASSWORD}" \
            '{
              main_email: $email,
              main_username: "prodifyreview",
              main_password: $password,
              friend_password: $password,
              days_back: 84,
              current_streak: 64,
              longest_streak: 71,
              main_level: 24
            }')
          curl -sS -f -X POST "${API_URL%/}/jobs/seed-screenshot-account" \
            -H "Content-Type: application/json" \
            -H "X-Internal-Job-Key: ${INTERNAL_JOB_KEY}" \
            -d "${body}" | jq .

      - name: Verify the reviewer can sign in and has premium access
        env:
          API_URL: ${{ inputs.api_url }}
          APPLE_REVIEW_EMAIL: ${{ secrets.APPLE_REVIEW_EMAIL }}
          APPLE_REVIEW_PASSWORD: ${{ secrets.APPLE_REVIEW_PASSWORD }}
        run: |
          set -euo pipefail
          login_body=$(jq -n \
            --arg email "${APPLE_REVIEW_EMAIL}" \
            --arg password "${APPLE_REVIEW_PASSWORD}" \
            '{email: $email, password: $password}')
          # The login response holds access and refresh tokens, so only the derived
          # entitlement and streak views are printed.
          token=$(curl -sS -f -X POST "${API_URL%/}/auth/login" \
            -H "Content-Type: application/json" \
            -d "${login_body}" | jq -r .access_token)
          curl -sS -f "${API_URL%/}/billing/entitlement" -H "Authorization: Bearer ${token}" | jq .
          curl -sS -f "${API_URL%/}/streak/overview" -H "Authorization: Bearer ${token}" | jq '{current_streak, longest_streak}'
