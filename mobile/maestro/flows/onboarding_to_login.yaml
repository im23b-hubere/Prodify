appId: com.prodify.app
---
- tapOn:
    point: "70%,55%"
- extendedWaitUntil:
    visible:
      id: "onboarding-intro"
    timeout: 20000
- tapOn:
    point: "90%,10%"
- assertVisible:
    id: "onboarding-experience"
- tapOn: "Less than 1 year"
- extendedWaitUntil:
    visible:
      id: "onboarding-genre"
    timeout: 8000
- tapOn: "Hip-Hop / Trap"
- extendedWaitUntil:
    visible:
      id: "onboarding-producer-goal"
    timeout: 8000
- tapOn: "Finish more tracks"
- extendedWaitUntil:
    visible:
      id: "onboarding-weekly-goal"
    timeout: 8000
- tapOn: "See my plan"
- assertVisible:
    id: "onboarding-plan"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Let's get started"
    timeout: 20000
- assertVisible: "Create account"
