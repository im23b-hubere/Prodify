appId: com.prodify.app
---
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 90000
# Credentials arrive at runtime so they are never baked into the uploaded simulator build.
- openLink: "prodify://e2e/bootstrap?email=${TEST_EMAIL}&password=${TEST_PASSWORD}"
# iOS can still ask "Open in Prodify?" although the workflow pre-approves the scheme.
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "App access|Skip for now \\(dev\\)|Start session|START SESSION"
    timeout: 180000
- runFlow:
    when:
      visible: "Skip for now \\(dev\\)"
    commands:
      - tapOn: "Skip for now \\(dev\\)"
- extendedWaitUntil:
    visible:
      id: "dashboard-studio-hud"
    timeout: 180000
- runFlow:
    file: dismiss_overlays.yaml
- runFlow:
    file: recover_dashboard_idle.yaml
- extendedWaitUntil:
    visible:
      id: "dashboard-start-session"
    timeout: 90000
- assertVisible: "Start session"
