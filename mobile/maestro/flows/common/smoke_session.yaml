appId: com.prodify.app
---
# Session start → stop → return to dashboard (testID-driven for CI speed).
- tapOn:
    id: dashboard-start-session
- extendedWaitUntil:
    visible:
      id: session-type-beat_making
    timeout: 45000
- tapOn:
    id: session-type-beat_making
- tapOn:
    id: session-setup-start
- extendedWaitUntil:
    visible:
      id: dashboard-stop-session
    timeout: 90000
- tapOn:
    id: dashboard-stop-session
# The dashboard button behind the alert has the same label.
- tapOn:
    text: "End session"
    rightOf:
      text: "Keep going"
- extendedWaitUntil:
    visible:
      id: session-complete-screen
    timeout: 90000
- tapOn:
    id: session-complete-back
- extendedWaitUntil:
    visible:
      id: dashboard-start-session
    timeout: 60000
