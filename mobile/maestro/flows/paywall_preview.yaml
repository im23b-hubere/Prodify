appId: com.prodify.app
---
- launchApp:
    clearState: true
- runFlow:
    file: common/e2e_login_dashboard.yaml
- openLink: "prodify://paywall"
- runFlow: common/confirm_deep_link.yaml
- extendedWaitUntil:
    visible: "App access"
    timeout: 20000
- assertVisible: "Best value"
- assertVisible: "6 months"
- assertVisible: "CHF 50.00"
- assertVisible: "1 week"
- assertVisible: "CHF 10.00"
- assertVisible: "Continue"
- assertVisible: "Restore purchases"
