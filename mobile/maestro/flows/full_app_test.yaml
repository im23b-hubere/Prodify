appId: com.prodify.app
env:
  TEST_EMAIL: test@prodify.app
  TEST_PASSWORD: Test1234!
---
# --- Existing-account login ---
- launchApp:
    clearState: true
- runFlow:
    file: common/e2e_login_dashboard.yaml

# --- Core session flow (smoke baseline) ---
- runFlow:
    file: common/smoke_session.yaml

# --- Tab navigation ---
- runFlow:
    file: common/smoke_tabs.yaml

# --- Secondary screens (deep links + in-app navigation) ---
- openLink: prodify://streak/history
- runFlow:
    file: common/confirm_deep_link.yaml
- extendedWaitUntil:
    visible: "Streak history"
    timeout: 20000
- back

- openLink: prodify://notifications
- runFlow:
    file: common/confirm_deep_link.yaml
- extendedWaitUntil:
    visible: "Notifications"
    timeout: 20000
- assertVisible: "Preferences"
- back

- openLink: prodify://session-trash
- runFlow:
    file: common/confirm_deep_link.yaml
- extendedWaitUntil:
    visible: "Session trash"
    timeout: 20000
- back

- openLink: prodify://session/setup
- runFlow:
    file: common/confirm_deep_link.yaml
- extendedWaitUntil:
    visible: "New Session"
    timeout: 20000
- openLink: prodify://dashboard
- runFlow:
    file: common/confirm_deep_link.yaml
- extendedWaitUntil:
    visible:
      id: "dashboard-studio-hud"
    timeout: 30000

# --- Stats: weekly recap ---
- tapOn:
    id: "tab-stats"
- extendedWaitUntil:
    visible:
      id: "stats-screen"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "stats-open-weekly-recap"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "stats-open-weekly-recap"
- extendedWaitUntil:
    visible: "Weekly recap"
    timeout: 20000
- tapOn: "Close"

# --- Progression overview ---
- openLink: prodify://progression-overview
- runFlow:
    file: common/confirm_deep_link.yaml
- extendedWaitUntil:
    visible: "Your rank"
    timeout: 20000
- assertVisible: "All ranks"
- openLink: prodify://dashboard
- runFlow:
    file: common/confirm_deep_link.yaml
- extendedWaitUntil:
    visible:
      id: "dashboard-studio-hud"
    timeout: 30000

# --- Profile: public profile + legal ---
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible:
      id: "profile-screen"
    timeout: 20000
- runFlow:
    when:
      visible: "View public profile"
    file: common/view_public_profile.yaml

- openLink: prodify://notifications
- runFlow:
    file: common/confirm_deep_link.yaml
- extendedWaitUntil:
    visible: "Notifications"
    timeout: 20000
- assertVisible: "Preferences"

- openLink: prodify://legal/privacy
- runFlow:
    file: common/confirm_deep_link.yaml
- extendedWaitUntil:
    visible: "Privacy policy"
    timeout: 15000

- openLink: prodify://legal/terms
- runFlow:
    file: common/confirm_deep_link.yaml
- extendedWaitUntil:
    visible: "Terms of use"
    timeout: 15000

# --- Finish on dashboard ---
- openLink: prodify://dashboard
- runFlow:
    file: common/confirm_deep_link.yaml
- extendedWaitUntil:
    visible:
      id: "dashboard-start-session"
    timeout: 30000
- assertVisible: "START SESSION"
